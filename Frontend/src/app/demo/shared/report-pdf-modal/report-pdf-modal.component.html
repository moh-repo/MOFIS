<p-dialog
  [(visible)]="visible"
  [header]="title"
  [modal]="true"
  [maximizable]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  appendTo="body"
  [style]="{ width: '95vw', maxWidth: '1400px' }"
  [contentStyle]="{ padding: '0', overflow: 'hidden', minHeight: '82vh' }"
  [attr.dir]="translationService.isRTL() ? 'rtl' : 'ltr'"
  (onShow)="onDialogShow()"
  (onHide)="onDialogHide()">

  @if (dialogReady && viewerKey > 0) {
    <app-report-viewer
      [useModal]="false"
      [pdfApiPath]="pdfApiPath"
      [pdfQuery]="pdfQuery"
      [pdfBody]="pdfBody"
      [pdfBlob]="pdfBlob"
      [loadTrigger]="viewerKey"
      [printOnLoad]="printOnLoad"
      [filename]="filename"
      viewerHeight="82vh">
    </app-report-viewer>
  }
</p-dialog>
