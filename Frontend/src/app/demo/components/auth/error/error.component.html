<!--
  QA C2 / UI-003: the emblem here was the template's, and its alt text said so
  ("MOFIS logo") to anyone reading with a screen reader. The decorative artwork
  below it said nothing the heading did not.
-->
<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden" [attr.dir]="translationService.isRTL() ? 'rtl' : 'ltr'">
    <div class="flex flex-column align-items-center justify-content-center">
        <img [src]="logoUrl" [alt]="'LAYOUT.SYSTEM_NAME' | translate" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, rgba(233, 30, 99, 0.4) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center" style="border-radius:53px">

                <div class="flex justify-content-center align-items-center bg-pink-500 border-circle mb-4" style="height:3.2rem; width:3.2rem;">
                    <i class="pi pi-fw pi-exclamation-circle text-2xl text-white"></i>
                </div>

                <h1 class="text-900 font-bold text-3xl lg:text-5xl mb-2 text-center">{{ 'AUTH.ERROR_OCCURRED' | translate }}</h1>
                <p class="text-600 mb-5 text-center">{{ 'AUTH.RESOURCE_NOT_AVAILABLE' | translate }}</p>

                <button pButton pRipple icon="pi pi-home"
                        [label]="'COMMON.GO_TO_DASHBOARD' | translate"
                        class="p-button-outlined w-full"
                        [routerLink]="['/']"></button>
            </div>
        </div>
    </div>
</div>
