<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img [src]="logoUrl" [alt]="'LAYOUT.SYSTEM_NAME' | translate" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, rgba(247, 149, 48, 0.4) 10%, rgba(247, 149, 48, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center" style="border-radius:53px">
                <div class="flex flex-column align-items-center">

                    <div class="flex justify-content-center align-items-center bg-orange-500 border-circle mb-4"
                         style="width:3.2rem; height:3.2rem;">
                        <i class="pi pi-lock text-white text-2xl"></i>
                    </div>

                    <h1 class="text-900 font-bold text-4xl lg:text-5xl mb-2">
                        {{ 'AUTH.ACCESS_DENIED' | translate }}
                    </h1>

                    <p class="text-600 mb-1 text-center">
                        {{ 'AUTH.PERMISSIONS_MESSAGE' | translate }}
                    </p>

                    <p class="text-500 text-sm mb-5 text-center">
                        {{ 'AUTH.CONTACT_ADMIN' | translate }}
                    </p>

                    <!-- Logout / Back to Login — uses window.location to bypass guard loops -->
                    <button pButton
                            icon="pi pi-sign-out"
                            [label]="'AUTH.LOGOUT_AND_LOGIN' | translate"
                            class="p-button-danger w-full mb-3"
                            (click)="logout()">
                    </button>

                    <button pButton
                            icon="pi pi-home"
                            [label]="'COMMON.GO_TO_DASHBOARD' | translate"
                            class="p-button-outlined p-button-secondary w-full"
                            (click)="goToDashboard()">
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>
