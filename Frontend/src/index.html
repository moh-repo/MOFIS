<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">

    <!-- Content-Security-Policy for the app shell. The SPA is a static build served
         by nginx/IIS, not by Spring Boot, so the backend's SecurityHeadersFilter
         cannot set this document's policy — only its own API responses'. Keeping it
         here means it ships with the build. This meta tag is the source of truth
         for every directive; a deployment that wants the header form as well
         (frame-ancestors is ignored in a meta tag) copies it from here.
         img-src also allows the OpenStreetMap tile host: the geographic map
         (Leaflet) draws its base layer from it, and without it every tile is blocked.
         This file is served verbatim to every client, so the comment stays short. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">

    <!-- Sets lang/dir before the first paint so the Arabic UI does not flash
         left-to-right. Must stay a plain blocking script in <head>. It was inline
         until the CSP went in; see the file for why it is a file. -->
    <script src="assets/js/boot-direction.js"></script>

    <title>نظام إدارة البعثات الدراسية</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The tab icon. A system logo uploaded through Settings replaces these at
         runtime (FaviconService); these are what shows until it loads, and what
         shows when no logo has been uploaded. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

    <!-- The Google Fonts stylesheet that used to be here (Inter, plus two
         preconnects) was dead weight, not a style choice: it defines the family
         "Inter", and the app's only font-family is `--font-family: "Inter var"`,
         a different name that no @font-face anywhere in src/ declares. The UI has
         always rendered in the system sans-serif fallback. See Backend/docs/CSP.md. -->
</head>

<body>
    <app-root></app-root>
</body>

</html>
