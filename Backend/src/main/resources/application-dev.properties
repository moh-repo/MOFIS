# Local development profile — never activate in production.
# Activate with: spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev)
#
# SEC-09: every secret below is a DEV-ONLY fallback, and every one is overridable
# by the environment variable named in its ${VAR:default}. The fallbacks remain so
# that `mvnw spring-boot:run -Dspring-boot.run.profiles=dev` starts against a local
# SQL Server with no setup; they are public (this file is committed) and must never
# be used for a shared, staging or production database. Set the variables (for
# instance from an untracked shell script or IDE run configuration) to keep your
# own local values out of the repository. application-prod.properties requires the
# production values with no fallback.

# Dev-only datasource defaults (override via MOHE_DATASOURCE_* env vars)
spring.datasource.url=${MOHE_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=MOHE;trustServerCertificate=true}
# S-01 (6 Sep 2026): dev runs as the least-privilege mohe_app login created by V090
# (DML + EXECUTE on the application schemas, nothing else). Flyway and the
# backup/restore endpoint use the sysadmin login below, as production would use
# their own DDL and backup-operator logins.
spring.datasource.username=${MOHE_DATASOURCE_USERNAME:mohe_app}
spring.datasource.password=${MOHE_DATASOURCE_PASSWORD:MoheApp-Dev-2026!x}
spring.flyway.user=${SPRING_FLYWAY_USER:sa}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:P@ssw0rd}
mohe.admin-datasource.username=${MOHE_ADMIN_DATASOURCE_USERNAME:sa}
mohe.admin-datasource.password=${MOHE_ADMIN_DATASOURCE_PASSWORD:P@ssw0rd}

# Dev-only JWT secret (min 32 chars). Override with JWT_SECRET env var.
jwt.secret=${JWT_SECRET:mohe-dev-secret-only-for-local-dev-not-for-production}

# Dev-only file encryption key (32 bytes, Base64).
#
# THIS KEY IS PUBLIC. It is committed, and it is simply the bytes 01 02 ... 20.
# Treat every file it encrypts as if it were stored in the clear: it protects
# nothing from anyone holding this repository.
#
# That was not merely theoretical. Until V032, 53 encrypted student documents
# were committed under uploads/ next to this line, so the repository shipped both
# the ciphertext and its key. The files are untracked now and uploads/ is
# ignored, but they remain in git history, and so does this key. Any document
# that existed in the working tree before that change must be considered
# disclosed to anyone who has ever cloned this repository.
#
# Never set MOHE_FILE_ENCRYPTION_KEY to this value outside local development.
# application-prod.properties requires the variable with no fallback, so a
# production deployment cannot inherit it by accident.
app.file-encryption.key=${MOHE_FILE_ENCRYPTION_KEY:AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev-only student-portal test account. SEC-09: off unless asked for, and no
# committed credential: the runner rewrote the password of this account (attached
# to the first student) on every start, so a committed password was a working
# login on any database a dev build pointed at. To use it locally, set
# MOHE_PORTAL_INIT_TEST_ACCOUNT=true plus MOHE_PORTAL_TEST_LOGIN_KEY and
# MOHE_PORTAL_TEST_PASSWORD. Startup does not need it: without them the runner
# logs a warning and does nothing.
student-portal.init-test-account=${MOHE_PORTAL_INIT_TEST_ACCOUNT:false}

# JPA: use none for normal local runs. To validate entity mappings against DB once after
# schema changes, temporarily set spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=none

# No mail server locally: print the student-portal reset OTP to the console.
mohe.student-portal.otp.log-to-console=true

# O-15 / SEC-09: test-account credentials come from the environment only.
student-portal.test-account.login-key=${MOHE_PORTAL_TEST_LOGIN_KEY:}
student-portal.test-account.password=${MOHE_PORTAL_TEST_PASSWORD:}
