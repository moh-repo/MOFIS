spring.application.name=mohe

# No default profile. A process that does not say which profile it is gets no
# datasource, no JWT secret and no encryption key, and fails at startup — which is
# the right outcome for a production box that forgot SPRING_PROFILES_ACTIVE=prod.
# Local development: -Dspring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev);
# the Maven test run sets spring.profiles.default=dev in the surefire configuration.

# Bilingual validation messages (English + Arabic) — see messages.properties / messages_ar.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Datasource, JWT secret and encryption key are supplied by the active profile:
# application-dev.properties carries local defaults; application-prod.properties
# requires the MOHE_* / JWT_SECRET environment variables with no fallback.
# Deliberately no ${VAR:} fallbacks here — an empty string would let the app start
# and fail later, instead of refusing to start.

spring.jpa.properties.hibernate.default_schema=MOHECORE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# JDBC batching. Honest scope note: every entity here uses IDENTITY ids, and
# Hibernate disables INSERT batching for IDENTITY — so these settings batch
# flush-time UPDATEs and DELETEs only (e.g. saveAll of session terminations,
# bulk alert updates). Do not expect insert speedups without moving to sequences.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# The API authenticates with JWT; the only Spring user store is the actuator account
# that ProdActuatorSecurityConfig builds itself from spring.security.user.* (prod only).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Schema migrations (security plan O-29, decision D-4 option A): the numbered
# scripts in docs/scripts are packaged into the jar as db/migration and applied by
# Flyway on startup, under the system tenant scope (FlywayScopeConfig). A database
# that already exists is baselined at V096 - everything up to it was applied by
# hand, see docs/MIGRATION_RUNBOOK.md - and from V097 on Flyway applies and records
# each script in dbo.flyway_schema_history; a script edited after it ran fails
# validation and stops the application. MOHE_FLYWAY_ENABLED=false keeps the manual
# procedure (the runbook says when). The migration login needs DDL rights: where the
# application runs as the least-privilege mohe_app login (V090), give Flyway its own
# credentials through SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD.
spring.flyway.enabled=${MOHE_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=96
spring.flyway.baseline-description=applied by hand through V096 (MIGRATION_RUNBOOK.md)
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# Local verbose SQL: add spring.profiles.active=dev (see application-dev.properties).
# Initialize data - disabled since data already exists
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql


# Server configuration
server.port=8082
# O-21: behind the TLS-terminating proxy the API must trust X-Forwarded-Proto, or
# it never sees a secure request and never sends Strict-Transport-Security.
server.forward-headers-strategy=${MOHE_FORWARD_HEADERS_STRATEGY:native}
# SEC-04: which peers Tomcat's RemoteIpValve believes when they send X-Forwarded-For
# / X-Forwarded-Proto. Tomcat's default trusts every private-range address (10/8,
# 172.16/12, 192.168/16, loopback), so any client inside the network could spoof
# its address: dodge the login throttle, pass the admin IP allowlist and sign the
# audit trail with any IP. The default here is empty, which Tomcat reads as "trust
# no peer": the connecting socket address is the client and forwarded headers are
# ignored. Behind a real reverse proxy set MOHE_TRUSTED_PROXIES to a regex matching
# only that proxy's address(es), e.g. the env var value 10\.0\.4\.17 (dots
# escaped). Without it, X-Forwarded-Proto is not
# honoured either, so HSTS (O-21) needs this set behind a TLS-terminating proxy.
server.tomcat.remoteip.internal-proxies=${MOHE_TRUSTED_PROXIES:}
server.servlet.context-path=/mohe

# Logging: include requestId from MDC when set by RequestIdFilter
logging.pattern.console=%d{ISO8601} [%X{requestId}] %-5level %logger{36} - %msg%n
logging.level.org.springframework=info
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql=info
logging.level.com.dilaw.mohe=info
# Jasper JRXML uses XSD; legacy DTD defaults still trigger harmless deprecation warnings at compile time
logging.level.net.sf.jasperreports.engine.xml.JRTextFieldFactory=ERROR
logging.level.net.sf.jasperreports.engine.xml.JRBandFactory=ERROR

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# File storage paths
file.upload-dir=uploads/

# S-10: several file keys may be live while a rotation runs: id:base64 pairs,
# and the id new files are written under (default: the highest id). The single
# MOHE_FILE_ENCRYPTION_KEY, if set, is key id 1. See docs/KEY_ROTATION.md.
app.file-encryption.keys=${MOHE_FILE_ENCRYPTION_KEYS:}
app.file-encryption.active-key=${MOHE_FILE_ENCRYPTION_ACTIVE_KEY:}
# File encryption at rest (AES-256-GCM): app.file-encryption.key comes from the active
# profile (dev default in application-dev.properties; MOHE_FILE_ENCRYPTION_KEY required in prod).

# Audit log: stored in main DB schema AUDITLOG. No separate DB.
# spring.audit-log.datasource.* removed – audit API reads from main datasource.

# Enable async processing for audit logs
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Scheduler pool. Spring's default is ONE thread shared by every @Scheduled job:
# the 15-minute scheduled-report runner (blocking SMTP with attachments), the
# 01:00 alert-event detection and the 07:00 document-expiry check. A hung SMTP
# send on the report runner would silently delay or skip both nightly crons.
spring.task.scheduling.pool.size=3

# Multi-country / ministry: main (ministry) country ID for display/defaults (optional)
# app.main-country-id=

# Report timezone: used for generation timestamps in PDFs and Jasper reports
mohe.report.timezone=${MOHE_REPORT_TIMEZONE:Asia/Riyadh}

# Report renderer limits (G49). Filling a report is CPU-bound with a large live
# set, so concurrency is capped to bound peak heap rather than to use every core;
# 0 sizes it from the machine (2-4). Requests over the limit wait in the queue and
# are refused with 503 once it is full. A render past the timeout is cancelled and
# answered with 504, which frees the worker for the next report.
mohe.report.render.threads=${MOHE_REPORT_RENDER_THREADS:0}
mohe.report.render.queue=${MOHE_REPORT_RENDER_QUEUE:32}
mohe.report.render.timeout-seconds=${MOHE_REPORT_RENDER_TIMEOUT_SECONDS:90}

# Cache: Caffeine in-memory cache for periodic reports (TTL 60 min, max 500 entries)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m

# CORS – allowed origins for frontend (comma-separated). In production set CORS_ALLOWED_ORIGINS env to explicit list.
# Split UI/API hosts: include every browser origin that calls the API, e.g. https://portal.example.com,https://admin.example.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Set to false in production so only cors.allowed-origins is used (no localhost:* or null)
cors.allow-dev-patterns=${CORS_ALLOW_DEV_PATTERNS:true}

# SpringDoc OpenAPI 3 / Swagger UI (optional: set to false in production)
# API docs: GET /mohe/v3/api-docs   Swagger UI: /mohe/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Student portal: set true in dev to auto-seed the test account. MUST be false in production.
student-portal.init-test-account=false

# JWT: jwt.secret comes from the active profile (dev default; JWT_SECRET required in prod, min 32 chars).
# DEC-17 (W5-02): an hour, refreshed by the browser at about three quarters of its
# life; a session may be renewed until jwt.absolute-session-hours after the sign-in.
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# S-10: the secret before the last rotation. Tokens signed with it stay valid
# until they expire; new tokens always use jwt.secret. Unset once every token
# minted under the old secret has expired (jwt.expiration-seconds).
jwt.secret-previous=${JWT_SECRET_PREVIOUS:}
jwt.session-validation-enabled=${JWT_SESSION_VALIDATION:true}

# Rate limit: login attempts per IP per minute (simple in-memory filter)
rate-limit.login.max-per-minute=${RATE_LIMIT_LOGIN_MAX_PER_MINUTE:10}
# Rate limit: report renders (PDF / Word / Excel / chart report) per user per minute
rate-limit.reports.max-per-minute=${RATE_LIMIT_REPORTS_MAX_PER_MINUTE:120}
# Rate limit: JSON under the report prefixes (metadata, rows, chart data) per user per minute
rate-limit.report-data.max-per-minute=${RATE_LIMIT_REPORT_DATA_MAX_PER_MINUTE:600}
# Rate limit: bulk import operations per user per minute
rate-limit.import.max-per-minute=${RATE_LIMIT_IMPORT_MAX_PER_MINUTE:5}
# Which context-relative path prefixes the two limits above apply to (comma lists).
# ApiRateLimitFilter matches on them and RateLimitFilterConfig registers on them, so
# there is one list to keep right; ApiRateLimitFilterTest checks it against every
# report/chart controller. Change only when a report module moves.
mohe.security.rate-limit.report-prefixes=${MOHE_RATE_LIMIT_REPORT_PREFIXES:/api/reports,/api/periodic-reports,/api/custom-reports,/api/statistical-reports,/api/university-reports,/api/v1/reports,/api/v1/charts,/api/v1/ums/reports,/api/v1/studentTotalReportAll}
mohe.security.rate-limit.import-prefixes=${MOHE_RATE_LIMIT_IMPORT_PREFIXES:/api/v1/import}

# Actuator: expose health and info only (restrict in production via management.endpoints.web.exposure)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Client address and student-portal OTP (August 2026 revision)
# ---------------------------------------------------------------------------
# Honour X-Forwarded-For only behind a proxy that overwrites it; off, the login
# throttle and the sign-in audit use the socket address. See ClientIpResolver.
mohe.security.trust-forwarded-for=${MOHE_TRUST_FORWARDED_FOR:false}
# Student-portal password-reset OTP: sent by e-mail through the notification
# settings of the student's country. Console logging of the code is a local
# development aid only (dev profile turns it on); never in production.
mohe.student-portal.otp.log-to-console=${MOHE_PORTAL_OTP_LOG_TO_CONSOLE:false}
# Wrong guesses allowed per OTP before it is invalidated.
mohe.student-portal.otp.max-attempts=${MOHE_PORTAL_OTP_MAX_ATTEMPTS:5}

# Student-portal uploads: active documents a student may hold before another
# upload is refused (400). There was no ceiling.
mohe.portal.upload.max-documents=${MOHE_PORTAL_UPLOAD_MAX_DOCUMENTS:20}

# --- Security plan, 6 Sep 2026 -------------------------------------------------
# O-26: a session may be refreshed for at most this long after login, whatever the
# per-token TTL; and a user holds at most this many live sessions (oldest evicted).
jwt.absolute-session-hours=${JWT_ABSOLUTE_SESSION_HOURS:12}
jwt.max-concurrent-sessions=${JWT_MAX_CONCURRENT_SESSIONS:3}
# O-36: SMTP and SMS hosts are set by administrators in the database. Loopback,
# link-local and private (RFC 1918) addresses are refused unless the relay really
# is on the private network, in which case set this to true.
mohe.outbound.allow-private=${MOHE_OUTBOUND_ALLOW_PRIVATE:false}
# O-15: the student-portal test account has no default credentials any more; the
# dev profile sets them. It is also refused outside the dev profile regardless.
student-portal.test-account.login-key=${MOHE_PORTAL_TEST_LOGIN:}
student-portal.test-account.password=${MOHE_PORTAL_TEST_PASSWORD:}
# S-01: the application login should hold DML only (V074). Backup and restore
# need server-level rights (BACKUP DATABASE, RESTORE), so they open their own
# connection with these credentials; when unset they fall back to the main login,
# which is the pre-V074 situation.
mohe.admin-datasource.username=${MOHE_ADMIN_DATASOURCE_USERNAME:}
mohe.admin-datasource.password=${MOHE_ADMIN_DATASOURCE_PASSWORD:}
# --- Security plan phase 2, 6 Sep 2026 --------------------------------------------
# R-19: per-user authorities are cached this long (evicted on every change anyway).
# 0 disables the cache; use 0 on a multi-instance deployment without a shared
# eviction signal (decision D-10).
ums.authority-cache.ttl-seconds=${UMS_AUTHORITY_CACHE_TTL_SECONDS:60}
# R-14: a direct (per-user) permission grant is an exception and lapses after at
# most this many days; the nightly review deactivates lapsed rows and lists the
# rest in the log.
ums.direct-grant.max-days=${UMS_DIRECT_GRANT_MAX_DAYS:90}
ums.direct-grant.review-cron=${UMS_DIRECT_GRANT_REVIEW_CRON:0 15 6 * * *}
# R-16 / N-04 (decision D-13): the super admin may approve or reject a Wafar spend
# without owning the attaché, audited WAFAR_SUPERADMIN_APPROVE. Set false once every
# attaché has two finance users (D-13 a).
mohe.policy.wafar.super-admin-approves=${MOHE_POLICY_WAFAR_SUPER_ADMIN_APPROVES:true}
# Live QA M2 (23 Sep 2026): the super admin may also run the Wafar reconciliation —
# a comparison of recorded Wafar against accounting's earmarks, not a money entry —
# so a stale run can be refreshed for every attaché at once. Ministry admins and
# staff stay readers whatever this says.
mohe.policy.wafar.super-admin-reconciles=${MOHE_POLICY_WAFAR_SUPER_ADMIN_RECONCILES:true}
# O-33 (decision D-7): exports and document downloads are always written to
# REPORT_ACCESS_LOG; single-student detail views only when this is true.
mohe.audit.detail-views=${MOHE_AUDIT_DETAIL_VIEWS:false}
# S-03: privileged grants (tier roles, *.APPROVE, SYSTEM.RESTORE, UMS_ADMIN.*, the
# administrator flag) and restores are requested and approved by a second
# administrator (entity types USER_PRIVILEGE_CHANGE, SYSTEM_RESTORE; V096). The
# super admin is exempt and audited. false applies them at once, as before.
ums.four-eyes.enabled=${UMS_FOUR_EYES_ENABLED:true}

# O-16: multi-factor authentication (TOTP). enforce=true requires a second factor
# from the super admin, ministry and country administrators and any account
# holding a *.APPROVE, SYSTEM.RESTORE or UMS_ADMIN.* code; everyone else may
# enrol from the profile page. MOHE_MFA_KEY protects the stored secrets (required in
# production; elsewhere a key derived from JWT_SECRET is used, with a warning). Five wrong codes
# lock the factor for fifteen minutes; the pending token lives five minutes.
mohe.mfa.enforce=${MOHE_MFA_ENFORCE:true}
mohe.mfa.issuer=${MOHE_MFA_ISSUER:MOHE}
mohe.mfa.encryption-key=${MOHE_MFA_KEY:}
# W5-04: the key before a rotation, read (and moved to MOHE_MFA_KEY at sign-in) until unset.
mohe.mfa.encryption-key-previous=${MOHE_MFA_KEY_PREVIOUS:}
mohe.mfa.max-failures=${MOHE_MFA_MAX_FAILURES:5}
mohe.mfa.lock-minutes=${MOHE_MFA_LOCK_MINUTES:15}
mohe.mfa.pending-token-seconds=${MOHE_MFA_PENDING_TOKEN_SECONDS:300}

# S-08: sign-in restrictions per tier or role, off by default. One rule per
# key in braces, e.g.
#   MINISTRY_ADMIN{ip=10.0.0.0/8 192.168.10.0/24; hours=SUN-THU 07:00-19:00; zone=Asia/Riyadh} SUPER_ADMIN{ip=10.0.0.0/8}
# ip= refuses a sign-in from outside the blocks (audited LOGIN_DENIED_IP);
# hours= requires the second factor outside the window rather than refusing.
# The address is what ClientIpResolver saw: set MOHE_TRUST_FORWARDED_FOR behind a proxy.
mohe.access.rules=${MOHE_ACCESS_RULES:}

# S-09: a token presented from a different address AND user agent than the
# session was issued to is audited (SESSION_ANOMALY); a privileged account's
# session is ended (SESSION_ANOMALY_ENDED), any other is rebound.
mohe.session-binding.enabled=${MOHE_SESSION_BINDING:true}

# S-07: the most rows one account may export in one file, by tier (0 = no cap).
# Over the cap the export is refused (403, audited EXPORT_CAPPED). Every exported
# PDF and workbook carries "Exported by <user> on <date> for <country>".
mohe.export.row-cap.country-staff=${MOHE_EXPORT_CAP_COUNTRY_STAFF:5000}
mohe.export.row-cap.country-admin=${MOHE_EXPORT_CAP_COUNTRY_ADMIN:20000}
mohe.export.row-cap.ministry-staff=${MOHE_EXPORT_CAP_MINISTRY_STAFF:50000}
mohe.export.row-cap.ministry-admin=${MOHE_EXPORT_CAP_MINISTRY_ADMIN:0}
mohe.export.row-cap.super-admin=${MOHE_EXPORT_CAP_SUPER_ADMIN:0}

# S-12: data retention and minimisation (docs/DATA_RETENTION.md). Dry run by
# default: the nightly run only counts and writes a report until the periods
# are confirmed and MOHE_RETENTION_DRY_RUN=false (or POST /api/v1/admin/retention/apply).
mohe.retention.enabled=${MOHE_RETENTION_ENABLED:true}
mohe.retention.dry-run=${MOHE_RETENTION_DRY_RUN:true}
mohe.retention.cron=${MOHE_RETENTION_CRON:0 45 3 * * *}
mohe.retention.sessions-days=${MOHE_RETENTION_SESSIONS_DAYS:90}
mohe.retention.student-years=${MOHE_RETENTION_STUDENT_YEARS:7}
mohe.retention.student-terminal-statuses=${MOHE_RETENTION_STUDENT_TERMINAL:WITHDRAWN,TRANSFERRED,DECEASED}
mohe.retention.report-dir=${MOHE_RETENTION_REPORT_DIR:archive/retention}

# S-11: portal accounts with no sign-in for this long are set INACTIVE nightly
# (the attaché reactivates from the portal accounts screen).
mohe.student-portal.dormant.enabled=${MOHE_PORTAL_DORMANT_ENABLED:true}
mohe.student-portal.dormant.days=${MOHE_PORTAL_DORMANT_DAYS:365}
mohe.student-portal.dormant.cron=${MOHE_PORTAL_DORMANT_CRON:0 20 3 * * *}

# R-21: role windows are opened and closed nightly; a delegation lasts at most this many days.
ums.role-window.cron=${UMS_ROLE_WINDOW_CRON:0 5 0 * * *}
ums.delegation.max-days=${UMS_DELEGATION_MAX_DAYS:90}

# S-05: the dormant-account rule. An active account with no sign-in for `days` is
# set INACTIVE (sessions ended, direct grants lapsed); a warning is audited from
# `warn-days`. The super admin is exempt.
ums.dormant.enabled=${UMS_DORMANT_ENABLED:true}
ums.dormant.days=${UMS_DORMANT_DAYS:90}
ums.dormant.warn-days=${UMS_DORMANT_WARN_DAYS:75}
ums.dormant.cron=${UMS_DORMANT_CRON:0 20 4 * * *}

# S-04: the quarterly access review. Reviews open on the first day of each quarter
# and are due after `due-days`; an item not attested by then is flagged and, with
# disable-unattested=true, the account is set INACTIVE.
ums.access-review.enabled=${UMS_ACCESS_REVIEW_ENABLED:true}
ums.access-review.due-days=${UMS_ACCESS_REVIEW_DUE_DAYS:30}
ums.access-review.disable-unattested=${UMS_ACCESS_REVIEW_DISABLE_UNATTESTED:false}
ums.access-review.open-cron=${UMS_ACCESS_REVIEW_OPEN_CRON:0 0 5 1 1,4,7,10 *}
ums.access-review.overdue-cron=${UMS_ACCESS_REVIEW_OVERDUE_CRON:0 40 4 * * *}

# O-34: structured security logging. The console keeps its pattern for whoever
# tails it; the log file, when MOHE_LOG_FILE names one, is ECS JSON with the
# security events' MDC fields at top level (docs/SECURITY_LOGGING.md). The action
# prefixes that count as security events can be replaced with
# MOHE_SECURITY_EVENT_ACTIONS (comma-separated).
logging.file.name=${MOHE_LOG_FILE:}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=mohe
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE:dev}
mohe.security-events.actions=${MOHE_SECURITY_EVENT_ACTIONS:LOGIN_FAILED,LOGIN_DENIED,LOGIN_OUTSIDE,ACCOUNT_,ACCESS_DENIED,APPROVAL_ROLE_BYPASS,APPROVAL_SELF_APPROVAL_BYPASS,WAFAR_SUPERADMIN,WAFAR_WRITE_ELEVATED,WAFAR_CORRECT,SYSTEM_RESTORE,PRIVILEGE_CHANGE,CREATE_USER,DELETE_USER,UNLOCK_USER,PASSWORD_RESET,ASSIGN_USER_ROLE,GRANT_USER_PERMISSION,SET_ROLE_PERMISSIONS,SESSION_,MFA_,ROLE_DELEGATED,ACCESS_REVIEW,AUDIT_RETENTION,DATA_RETENTION,EXPORT_CAPPED,PORTAL_,DIRECT_GRANT}

# O-35: audit retention. Nightly at 03:30 rows older than the period are exported
# to gzip NDJSON under the archive directory and then deleted, batch by batch;
# nothing is deleted that is not on disk first. ACCESS_DENIED rows keep one year.
mohe.audit.retention.enabled=${MOHE_AUDIT_RETENTION_ENABLED:true}
mohe.audit.retention.audit-years=${MOHE_AUDIT_RETENTION_YEARS:3}
mohe.audit.retention.access-denied-years=${MOHE_AUDIT_RETENTION_ACCESS_DENIED_YEARS:1}
mohe.audit.retention.archive-dir=${MOHE_AUDIT_ARCHIVE_DIR:archive/audit}
mohe.audit.retention.cron=${MOHE_AUDIT_RETENTION_CRON:0 30 3 * * *}
