# Production profile – override with your DB and URLs.
# Do not commit real credentials; use env vars or a secret store.

# ── Logging: production levels ───────────────────────────────
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.dilaw.mohe=INFO

# ── HikariCP connection pool ─────────────────────────────────
# Set max-pool-size based on your SQL Server CAL / core license.
# A common starting point for a small deployment: 10 connections.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MoheHikariPool

# Disable Swagger/OpenAPI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS – required in prod: set CORS_ALLOWED_ORIGINS to your UI origin(s), comma-separated (e.g. https://mohe.example.gov).
# Only these origins are allowed; dev patterns (localhost:*, null) are disabled.
cors.allow-dev-patterns=false

# Actuator: production – do not expose more than health/info; show-details off unless authorized
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# HTTP basic for /mohe/actuator/* except /mohe/actuator/health (see ProdActuatorSecurityConfig).
# Required in real deployments: set MOHE_ACTUATOR_PASSWORD (secrets manager / env). Optional: MOHE_ACTUATOR_USER (default actuator).
spring.security.user.name=${MOHE_ACTUATOR_USER:actuator}

# Query Builder: a read-only SQL Server login (created by V025) so composed queries cannot write.
# Strongly recommended in production: set the three MOHE_QUERY_ENGINE_* env vars. When they are
# blank the query engine falls back to the application's own db_owner connection and logs a WARN
# at startup — the DB-side read-only boundary that turns a validation escape into a failed query
# rather than a changed row is then absent. Blank keeps the documented fallback working; no file
# edit is needed to enable the read-only login, only the env vars.
mohe.query-engine.datasource.url=${MOHE_QUERY_ENGINE_URL:}
mohe.query-engine.datasource.username=${MOHE_QUERY_ENGINE_USERNAME:}
mohe.query-engine.datasource.password=${MOHE_QUERY_ENGINE_PASSWORD:}

student-portal.init-test-account=false

# Required in production — no defaults; startup fails if unset
spring.datasource.url=${MOHE_DATASOURCE_URL}
spring.datasource.username=${MOHE_DATASOURCE_USERNAME}
spring.datasource.password=${MOHE_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.session-validation-enabled=${JWT_SESSION_VALIDATION:true}

# Required in production — no defaults; startup fails if unset
app.file-encryption.key=${MOHE_FILE_ENCRYPTION_KEY}

# Actuator basic auth — required in production
spring.security.user.password=${MOHE_ACTUATOR_PASSWORD}

# Behind nginx / a load balancer that sets X-Forwarded-For, set
# MOHE_TRUST_FORWARDED_FOR=true so the login throttle and the sign-in audit see
# the real client address instead of the proxy's. Leave false when the process
# is reached directly.
mohe.security.trust-forwarded-for=${MOHE_TRUST_FORWARDED_FOR:false}
